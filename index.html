<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <title>KHOA HỌC DỮ LIỆU</title>

    <!-- Open Graph meta tags -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Hệ thống ôn tập trắc nghiệm KHDL" />
    <meta property="og:description" content="Website ôn ôn tập và làm trắc nghiệm môn KHDL. Chinh phục điểm cao dễ dàng!" />
    <!-- TODO: Thay thế các URL dưới đây bằng tên miền thật của bạn sau khi deploy -->
    <meta property="og:url" content="https://10diemcnxh.vercel.app/" />
    <meta property="og:image" content="https://10diemcnxh.vercel.app/anh-bia-share.png" />
    <!-- Fix for environments where fetch cannot be reassigned (like preview iframes) -->
    <script>
      const originalFetch = window.fetch;
      try {
        Object.defineProperty(window, 'fetch', {
          configurable: true,
          enumerable: true,
          get: () => originalFetch,
          set: (v) => { console.warn('Attempted to reassign window.fetch, ignoring.'); }
        });
      } catch (e) {
        console.warn('Could not define fetch setter:', e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
